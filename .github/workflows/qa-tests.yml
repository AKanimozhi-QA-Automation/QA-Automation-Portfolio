
name: QA Automation Demo

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  playwright-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run Playwright tests
        run: python -m pytest -m playwright

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report
          path: reports/report.html
          if-no-files-found: warn

 
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Newman and HTML Reporter
        run: npm install -g newman newman-reporter-htmlextra

      - name: Run Postman API Tests
        run: |
          mkdir -p reports
          newman run REST_API_Automation.postman_collection.json -r cli,htmlextra --reporter-htmlextra-export reports/newman-api-report.html

      - name: Upload Newman HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-api-html-report
          path: reports/newman-api-report.html
          if-no-files-found: warn
